name: Bug Report
description: Report a bug in Ezenitac-AiService/ImageViewer (Cross-Platform Rust Edition)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **Ezenitac-AiService/ImageViewer**.
        Please note this is an independent cross-platform Rust fork of `edith2580/ImageViewer (v1.0.6)`.
  - type: checkboxes
    id: fork-confirmation
    attributes:
      label: Fork & Version Confirmation
      description: Please confirm this issue applies to Ezenitac-AiService/ImageViewer and not the upstream Windows C#/.NET repository.
      options:
        - label: I confirm this bug occurs in Ezenitac-AiService/ImageViewer (not upstream edith2580/ImageViewer).
          required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "e.g. 1.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and steps to reproduce.
    validations:
      required: true
