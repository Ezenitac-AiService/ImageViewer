name: Release

# Builds the top-priority macOS bundle and build-only Linux tarball, runs launch verification
# on macOS, checks dependencies, and creates a DRAFT release. A maintainer publishes it only
# after the clean-device checklist (constitution v3.0.0 Launch Verification Gate).
# No path in this workflow publishes a non-draft release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package universal bundle (ad-hoc unless MACOS_SIGNING_IDENTITY is set)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: packaging/macos/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-macos
          path: target/release/ImageViewer-macos-universal.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Package build-only unverified tarball
        run: packaging/linux/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-linux
          path: dist/ImageViewer-linux-x64.tar.gz
          if-no-files-found: error

  verify-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            record: macos-arm64
          - runner: macos-15-intel
            record: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: asset-macos
          path: dist
      - name: Mount the DMG and start the app from it
        run: |
          hdiutil attach dist/ImageViewer-macos-universal.dmg -mountpoint /Volumes/ImageViewer -nobrowse
          packaging/verify/launch-check.sh /Volumes/ImageViewer/ImageViewer.app packaging/verify/fixtures/two-images/a.png launch-verification-${{ matrix.record }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: record-${{ matrix.record }}
          path: launch-verification-${{ matrix.record }}.json

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
          arguments: ""
          command-arguments: advisories bans licenses sources

  publish-draft:
    # Blocking: both macOS slices, lower-priority build-only Linux package, and the dependency gate.
    needs: [verify-macos, build-linux, deny]
    if: always() && needs.verify-macos.result == 'success' && needs.build-linux.result == 'success' && needs.deny.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: asset-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: record-*
          path: release-assets
          merge-multiple: true
      - name: Checksums and release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          cd release-assets
          sha256sum ImageViewer-macos-universal.dmg ImageViewer-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python3 packaging/verify/render-release-notes.py "${TAG#v}" release-assets release-notes.md
      - name: Create DRAFT release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ImageViewer ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/ImageViewer-macos-universal.dmg
            release-assets/ImageViewer-linux-x64.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/launch-verification-macos-*.json
