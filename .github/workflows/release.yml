name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0; leave empty for artifact-only build)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ImageViewer-windows-x64.exe
          - os: macos-latest
            artifact_name: ImageViewer-macos.dmg
          - os: ubuntu-latest
            artifact_name: ImageViewer-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI/Wayland dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release -p iv-app
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/iv-app.exe dist/ImageViewer-windows-x64.exe -Force

      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x packaging/macos/package-dmg.sh
          ./packaging/macos/package-dmg.sh
          mkdir -p dist
          cp target/release/ImageViewer-macos.dmg dist/ImageViewer-macos.dmg

      - name: Build Linux tarball
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x packaging/linux/package-appimage.sh
          ./packaging/linux/package-appimage.sh
          mkdir -p dist
          tar -czf dist/ImageViewer-linux-x64.tar.gz -C target/release ImageViewer.AppDir

      - name: Upload OS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Generate SHA256SUMS & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all OS release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum ImageViewer-windows-x64.exe ImageViewer-macos.dmg ImageViewer-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer-release-bundle
          path: release-assets/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: ImageViewer ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/ImageViewer-windows-x64.exe
            release-assets/ImageViewer-macos.dmg
            release-assets/ImageViewer-linux-x64.tar.gz
            release-assets/SHA256SUMS.txt
