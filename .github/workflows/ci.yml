name: CI

# Every proposed change: lint, test both build configurations, start the real application on
# Windows and macOS, and check dependencies (specs/004 contracts/release-verification-contract.md §5).

on:
  push:
    # Spec Kit feature branches (`NNN-name`) run CI on push, so a change can be verified on
    # Windows and macOS without opening a pull request.
    branches: [ main, master, '[0-9][0-9][0-9]-*' ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (shipped configuration)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (all features)
        run: cargo test --workspace --all-features
      - name: Tests (shipped configuration)
        run: cargo test --workspace
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  launch-macos:
    name: Launch check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package universal bundle
        run: packaging/macos/package-macos.sh
      - name: Start the bundle and verify it
        run: packaging/verify/launch-check.sh target/release/ImageViewer.app packaging/verify/fixtures/two-images/a.png launch-verification-macos-arm64.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-verification-ci-macos
          path: launch-verification-*.json

  launch-windows:
    name: Launch check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package and assert executable
        shell: pwsh
        run: packaging/windows/package-windows.ps1
      - name: Start the executable and verify it
        shell: pwsh
        run: packaging/verify/launch-check.ps1 dist/ImageViewer-windows-x64.exe packaging/verify/fixtures/two-images/a.png launch-verification-windows-x64.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-verification-ci-windows
          path: launch-verification-*.json

  launch-linux:
    name: Launch check (Linux, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-0 xvfb xdotool mesa-vulkan-drivers
      - name: Build
        run: cargo build --release --locked -p iv-app
      - name: Start under Xvfb and verify
        run: xvfb-run -a packaging/verify/launch-check.sh target/release/iv-app packaging/verify/fixtures/two-images/a.png launch-verification-linux-x64.json

  dependencies:
    name: Dependencies (cargo-deny, budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""
          command-arguments: advisories bans licenses sources
      - uses: dtolnay/rust-toolchain@stable
      - name: Shipped-component budget and no network clients
        env:
          COMPONENT_LIST: shipped-components.txt
        run: packaging/verify/component-count.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipped-components
          path: shipped-components.txt
