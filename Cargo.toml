[workspace]
resolver = "2"
members = [
    "crates/iv-core",
    "crates/iv-media",
    "crates/iv-platform",
    "crates/iv-app",
]

[workspace.package]
version = "1.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs4 = "0.13"
rand = "0.9"
lru = "0.19"
rayon = "1.10"
zune-jpeg = "0.4"
image = { version = "0.25.4", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
image-extras = "0.1"
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
rawpsd = "0.1"
jxl-oxide = "0.12"
exr = "1.7"
image-webp = "0.2"
tiff = "0.11"
moxcms = "0.7"
fast_image_resize = "5"
kamadak-exif = "0.6"
zip = { version = "9", default-features = false, features = ["deflate", "zstd"] }
notify-debouncer-mini = "0.7"
notify = "8"
directories = "6"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts", "clipboard", "x11", "wayland"] }
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
sys-locale = "0.3"
winresource = "0.1"
criterion = "0.5"
rcgen = "0.13"

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3
