[package]
name = "iv-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
iv-core = { path = "../iv-core" }
thiserror.workspace = true
lru.workspace = true
rayon.workspace = true
zune-jpeg.workspace = true
image.workspace = true
image-extras = { workspace = true, optional = true }
image_dds = { workspace = true, optional = true }
rawpsd = { workspace = true, optional = true }
jxl-oxide = { workspace = true, optional = true }
exr = { workspace = true, optional = true }
image-webp.workspace = true
tiff.workspace = true
moxcms.workspace = true
fast_image_resize.workspace = true
kamadak-exif.workspace = true
zip.workspace = true
notify-debouncer-mini.workspace = true
notify.workspace = true

[features]
default = []
# Extended-tier decoders (Unavailable in the shipped build; re-admitted per FR-023).
extended-formats = [
    "dep:image-extras",
    "dep:image_dds",
    "dep:rawpsd",
    "dep:jxl-oxide",
    "dep:exr",
    "image/ico",
    "image/tga",
    "image/qoi",
    "image/pnm",
    "image/hdr",
    "image/exr",
]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "animation_bench"
harness = false
