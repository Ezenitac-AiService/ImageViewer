[package]
name = "iv-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iv-core = { path = "../iv-core" }
thiserror.workspace = true
directories.workspace = true
rfd.workspace = true
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSURL", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-image-io = { version = "0.3", features = ["CGImageSource", "CGImageProperties"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace", "CGDataProvider", "CGBitmapContext", "CGContext"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFDictionary", "CFString", "CFNumber", "CFBase"] }

[dev-dependencies]
rcgen.workspace = true
